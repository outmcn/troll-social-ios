name: TrollSocial
options:
  bundleIdPrefix: com.outmcn
  deploymentTarget: "16.0"
targets:
  TrollSocial:
    type: application
    platform: iOS
    sources:
      - path: SocialApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.outmcn.trollsocial
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SocialApp/Info.plist
      properties:
        CFBundleDisplayName: TrollSocial
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "29"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
